# Slajdy wykładu na GitHub Pages: https://<użytkownik>.github.io/<repozytorium>/
# Jednorazowo w repozytorium: Settings -> Pages -> Source: GitHub Actions.
name: Slajdy na GitHub Pages

on:
  push:
    branches: [main]
    paths: ['wyklad/slajdy/**', '.github/workflows/slajdy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wyklad/slajdy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wyklad/slajdy/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # Chromium potrzebny tylko do eksportu PDF/PNG
      - run: npx slidev build --base "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wyklad/slajdy/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
