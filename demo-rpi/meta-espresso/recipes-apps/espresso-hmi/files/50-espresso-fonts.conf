<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Qt na eglfs prosi o domyślną czcionkę "Noto Sans", której w obrazie nie ma.
  Bez tej reguły fontconfig podstawia Liberation Mono (stała szerokość znaków)
  i szerokie napisy wychodzą poza ekran 800x480. Kierujemy ją na Liberation Sans.
-->
<fontconfig>
  <alias binding="same">
    <family>Noto Sans</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
