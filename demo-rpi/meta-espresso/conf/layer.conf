# Warstwa demonstracyjna: HMI ekspresu do kawy na Raspberry Pi 3B+

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "espresso"
BBFILE_PATTERN_espresso = "^${LAYERDIR}/"
BBFILE_PRIORITY_espresso = "10"

LAYERDEPENDS_espresso = "core qt6-layer raspberrypi"
LAYERSERIES_COMPAT_espresso = "wrynose"
